["Les agents et les véhicules prioritaires",`
<h3>Les gestes d'un agent qualifié</h3>
<ul>
<li><b>Un bras levé verticalement</b> : tous les usagers s'arrêtent. Ceux déjà engagés dans le carrefour le dégagent au plus vite.</li>
<li><b>Un ou deux bras tendus horizontalement</b> : ceux qui vont vers son ventre ou son dos s'arrêtent. Ceux qui arrivent de son côté, ou du côté de la main tendue, peuvent continuer : tout droit ou en tournant à gauche ou à droite. Deux bras tendus donnent la même consigne qu'un seul.</li>
<li><b>Torche rouge balancée</b> vers toi : tu t'arrêtes. L'agent peut aussi t'obliger à tourner dans la direction qu'il indique.</li>
<li><b>Mouvement vertical du bras</b> (de haut en bas) : ralentis. <b>Mouvement rotatif</b> : accélère.</li>
<li><b>Le sifflet</b> n'est pas une injonction : il attire seulement ton attention avant la consigne.</li>
<li>Une injonction peut aussi être donnée à la voix. Elle vaut pour les conducteurs et pour les piétons, et l'agent n'a pas à se justifier. Si on te demande de déplacer ton véhicule arrêté ou stationné, tu le déplaces.</li>
</ul>
<h3>Personnes autorisées</h3>
<ul>
<li>Surveillants habilités, capitaines de route, signaleurs d'une course cycliste, chefs de groupe de piétons ou de cavaliers : tu suis leurs indications, mais ce ne sont <b>pas des agents qualifiés</b>. Ils ne donnent pas d'injonctions et ne règlent pas la circulation.</li>
<li>Dans un carrefour sans feux, une personne autorisée peut arrêter la circulation si elle est identifiable et brandit le signal <b>C3</b> à bout de bras.</li>
<li>Après un accident ou une panne, le conducteur ne peut pas régler la circulation.</li>
<li>Un pompier peut régler la circulation et donner des ordres là où il intervient, mais il ne rédige pas de procès-verbal.</li>
</ul>
<h3>Véhicules prioritaires</h3>
<ul>
<li>Ils portent un <b>feu bleu clignotant</b> et un avertisseur sonore spécial (police, ambulance, pompiers).</li>
<li>Feu bleu <b>seul</b> : tu continues normalement.</li>
<li>Feu bleu <b>et</b> avertisseur sonore : tu dégages immédiatement la chaussée pour céder le passage, en ralentissant ou en t'arrêtant si nécessaire.</li>
</ul>
<h3>Ordre hiérarchique</h3>
<ol>
<li>Les injonctions des agents qualifiés</li>
<li>Les signaux lumineux</li>
<li>Les signaux routiers</li>
<li>Les règles générales</li>
</ol>
<p>Même une ambulance avec feu bleu et sirène s'arrête si un agent l'ordonne. Cet ordre ne s'applique pas au feu orange clignotant, aux signaux lumineux au-dessus des bandes, ni aux signaux de priorité B22 et B23. Le 112 est le numéro d'urgence : si une borne d'appel est proche, utilise-la de préférence.</p>`,[
["Un agent lève un bras verticalement. Tu…",["t'arrêtes","passes si c'est libre","ralentis seulement"],0,"Un bras levé verticalement : tous les usagers s'arrêtent."],
["Un agent tend un bras horizontalement. Tu arrives vers son dos. Tu…",["t'arrêtes","continues","tournes à droite"],0,"Ceux qui vont vers son ventre ou son dos s'arrêtent."],
["Un agent siffle. Cela signifie…",["qu'il veut attirer ton attention : ce n'est pas une injonction","que tu dois t'arrêter","que tu dois accélérer"],0,"Le sifflet prévient seulement qu'une injonction va suivre."],
["Un feu bleu clignote, sans avertisseur sonore. Tu…",["continues à rouler normalement","dégages la chaussée","t'arrêtes"],0,"Sans avertisseur sonore, le véhicule n'est pas prioritaire."],
["Une ambulance (feu bleu et sirène) arrive, mais un agent lui ordonne de s'arrêter. Elle…",["doit s'arrêter","passe quand même","passe en priorité"],0,"Les injonctions d'un agent passent avant tout."],
["Qui est un agent qualifié ?",["Un policier","Le capitaine de route d'une course cycliste","Le conducteur d'un véhicule en panne"],0,"Les personnes autorisées ne sont pas des agents qualifiés."]]],

["Direction obligatoire et sens unique",`
<p>Deux panneaux bleus portant une flèche se ressemblent : ne les confonds pas.</p>
<div class="signs">${sg(`<circle cx="30" cy="30" r="27" fill="#0b57a4"/><path d="M13 30H47M47 30 36 19M47 30 36 41" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,"Rond bleu : direction obligatoire")}${sg(`<rect x="4" y="9" width="52" height="42" rx="4" fill="#0b57a4"/><path d="M13 30H47M47 30 36 19M47 30 36 41" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,"Carré bleu : sens unique")}</div>
<ul>
<li><b>Rond bleu avec flèche</b> (obligation) : tu <b>dois</b> suivre la direction indiquée, selon la disposition des lieux : tout droit, à gauche ou à droite.</li>
<li><b>Carré bleu avec flèche</b> (indication) : la voie est à <b>sens unique</b>.</li>
<li>Un rond bleu avec plusieurs flèches : tu dois suivre l'une des directions indiquées.</li>
<li>Un panneau additionnel peut dispenser les cyclistes et les cyclomoteurs de classe A de suivre cette direction, ou leur permettre de rouler dans les deux sens.</li>
</ul>
<h3>Obstacle et choix du côté</h3>
<ul>
<li>Une flèche en diagonale vers le bas, placée sur un obstacle (poteau ou borne jaune), indique de quel côté le contourner.</li>
<li>Un signal d'indication avec deux flèches, sur un poteau ou une borne jaune : tu peux passer à gauche ou à droite.</li>
</ul>
<h3>Îlots directionnels</h3>
<p>Sans panneau, des marques hachurées au sol (îlot peint) ou des îlots construits te guident. Tu les contournes par la <b>droite</b>. Il est interdit d'y circuler, de s'y arrêter ou de s'y garer.</p>`,[
["Un rond bleu avec une flèche vers la gauche signifie…",["tu dois tourner à gauche","la voie est à sens unique","tu peux choisir ta direction"],0,"Rond bleu : obligation de suivre la flèche."],
["Un carré bleu avec une flèche signifie…",["la voie est à sens unique","tu dois suivre la flèche","tu peux passer à gauche ou à droite"],0,"Carré bleu : signal d'indication, voie à sens unique."],
["Un signal d'indication avec deux flèches sur un poteau jaune signifie…",["tu peux passer à gauche ou à droite","tu dois passer à droite","tu dois passer à gauche"],0,"Passage autorisé à droite ou à gauche."],
["Tu vois un îlot directionnel, peint ou construit. Tu le contournes…",["par la droite","par la gauche","en roulant dessus"],0,"On le contourne par la droite, sans y circuler ni s'y arrêter."],

["Agglomération, zones et rues spéciales",`
<h3>L'agglomération</h3>
<ul>
<li>C'est un espace dont les accès portent un panneau de <b>début</b>. Tu la quittes en passant le panneau de <b>fin</b>.</li>
<li>Le panneau jaune à bord rouge n'indique que la limite administrative d'une commune : il n'a aucun effet sur le code de la route.</li>
<li><b>Vitesse</b> : 50 km/h en agglomération, <b>30 km/h</b> en Région de Bruxelles-Capitale.</li>
<li>Exception : un panneau de limitation placé au-dessus ou juste après le panneau d'entrée fixe une autre vitesse jusqu'au prochain carrefour. Si c'est un <b>30</b> placé au-dessus du panneau de début, il vaut dans toute l'agglomération.</li>
<li>Hors agglomération : <b>90 km/h</b> en Wallonie, <b>70 km/h</b> en Flandre et à Bruxelles, sauf signal contraire.</li>
</ul>
<h3>Zone résidentielle</h3>
<ul>
<li>Début et fin signalés par des panneaux. <b>20 km/h</b> maximum. Un excès est sanctionné comme en agglomération.</li>
<li>Les piétons (pas les cyclistes) peuvent utiliser toute la largeur de la voie, sans gêner le trafic sans raison. Les enfants peuvent jouer sur la chaussée.</li>
<li>Tu ne te gares que sur un emplacement prévu, à droite ou à gauche du sens de la marche.</li>
</ul>
<h3>Rue réservée au jeu</h3>
<p>Toute la largeur est réservée aux jeux. Y entrent seulement les riverains en véhicule à moteur (qui y habitent ou y ont leur garage), les véhicules prioritaires, ceux qui ont une autorisation du gestionnaire de voirie, et les cyclistes. Tous roulent <b>au pas</b>.</p>
<h3>Zones, abords d'école et rue scolaire</h3>
<ul>
<li>Une <b>zone</b> est formée d'une ou plusieurs voies, avec un panneau de début et de fin. Les obligations de l'entrée valent de jour et de nuit. Avec un panneau électronique, l'obligation ne vaut que lorsqu'il est allumé.</li>
<li><b>Zone 30</b> : un excès est sanctionné comme en agglomération.</li>
<li><b>Abords d'école</b> : une zone 30 avec les deux panneaux « présence possible d'enfants » et « zone 30 ».</li>
<li><b>Rue scolaire</b> : fermée à certaines heures par des barrières ou par un C3 portant la mention « rue scolaire ». Réservée aux piétons, cyclistes et speedpedelecs. Les riverains peuvent en sortir, pas y entrer. Les conducteurs autorisés roulent au pas et cèdent le passage aux piétons et cyclistes.</li>
</ul>
<h3>Chemins réservés</h3>
<p>Un panneau montre quels usagers y circulent (piétons, cyclistes, cavaliers…). Si tu n'es pas repris, tu n'y entres pas, sauf pour rejoindre une propriété. 30 km/h maximum, avec une prudence accrue en présence d'enfants.</p>`,[

["La route pour automobiles",`
<h3>Reconnaître une route pour automobiles</h3>
<ul>
<li>Un panneau indique le début, un autre la fin. Contrairement à l'autoroute, tu peux y trouver des carrefours et des feux.</li>
<li>Les véhicules à moteur et les trains de véhicules y circulent, sauf les cyclomoteurs, les véhicules agricoles, les quadricycles sans habitacle et les trains de véhicules forains.</li>
<li>Les sens peuvent être séparés par des marques au sol ou par une berme centrale. Si la voie a deux ou trois chaussées nettement séparées, tu n'empruntes pas celle de gauche par rapport à ton sens (sauf règle locale).</li>
</ul>
<h3>La vitesse</h3>
<ul>
<li>Hors agglomération, avec berme centrale et au moins deux bandes par sens : <b>120 km/h</b>.</li>
<li>Hors agglomération, sens séparés seulement par des marques : <b>90 km/h</b> en Wallonie, <b>70 km/h</b> en Flandre et à Bruxelles.</li>
<li>En agglomération : 50 km/h, ou 30 km/h en Région de Bruxelles-Capitale.</li>
<li>Pas de vitesse minimale, mais rouler trop lentement sans raison reste une infraction.</li>
</ul>
<h3>Panne et accident</h3>
<ul>
<li>Triangle à 30 m au moins en amont, visible à 50 m (100 m sur autoroute).</li>
<li>Si tu t'arrêtes là où le stationnement est interdit, le conducteur enfile son gilet réfléchissant avant de sortir. Ce n'est pas obligatoire pour les passagers, mais c'est recommandé.</li>
</ul>
<h3>Dépasser et interdits</h3>
<ul>
<li>Roule le plus possible sur la bande de droite et dépasse par la gauche. Dépasser par la droite est une infraction grave. Dans un embouteillage, la file de droite peut aller plus vite sans que ce soit un dépassement.</li>
<li>Interdit : s'arrêter ou se garer sur la chaussée ou la bande d'arrêt d'urgence, rouler sur la berme centrale ou les raccordements transversaux, faire marche arrière, rouler en sens inverse, remorquer avec une attache de fortune.</li>
</ul>`,[
["Route pour automobiles, hors agglomération, avec berme centrale et deux bandes par sens. Vitesse maximale ?",["120 km/h","90 km/h","70 km/h"],0,"Berme centrale et deux bandes par sens : 120 km/h."],
["Route pour automobiles, hors agglomération, sens séparés par des marques, en Wallonie. Vitesse maximale ?",["90 km/h","70 km/h","120 km/h"],0,"90 km/h en Wallonie, 70 km/h en Flandre et à Bruxelles."],
["Une route pour automobiles peut comporter…",["des carrefours et des feux","aucun carrefour","seulement des feux"],0,"Contrairement à l'autoroute, elle peut avoir des carrefours et des feux."],

["Y a-t-il une vitesse minimale sur une route pour automobiles ?",["Non, mais rouler trop lentement sans raison est une infraction","Oui, 70 km/h","Oui, 50 km/h"],0,"Il n'y a pas de minimum, contrairement à l'autoroute."]]],

["Croiser et passages étroits",`
<h3>Croiser par la droite</h3>
<ul>
<li>Deux véhicules qui se rencontrent en sens opposé se croisent : chacun serre à <b>droite</b>, sur la bande de droite s'il y en a plusieurs.</li>
<li>Si la chaussée est trop étroite, tu peux emprunter l'accotement de plain-pied, sans mettre en danger les usagers qui s'y trouvent.</li>
<li>Tu ne peux pas rouler au-delà d'une <b>large ligne blanche</b> au bord de la chaussée (bord fictif) : cette partie est réservée à l'arrêt et au stationnement. Tu n'empruntes pas non plus la piste cyclable pour croiser. La bande cyclable suggérée, elle, fait partie de la chaussée.</li>
<li>Distance latérale suffisante : au moins <b>1 m</b> pour croiser un cycliste en agglomération, <b>1,5 m</b> hors agglomération.</li>

<h3>Rétrécissement de la chaussée</h3>

["Arrêt et stationnement : où et quand",`
<h3>Définitions</h3>
<ul>
<li><b>Arrêt</b> : le temps nécessaire pour faire monter ou descendre des personnes, ou pour charger ou décharger des choses (parfois plusieurs minutes, par exemple pour un déménagement).</li>
<li><b>Stationnement</b> : rester immobile au-delà de ce temps.</li>
<li>Arrêt et stationnement sont des actes <b>volontaires</b>. Si tu es contraint de t'immobiliser (feu rouge, embouteillage, céder le passage), ton véhicule est <b>immobilisé</b> : ce n'est ni un arrêt ni un stationnement.</li>
<li>Un véhicule <b>en panne</b> n'est ni à l'arrêt ni en stationnement : les signaux d'arrêt et de stationnement ne le concernent pas. S'il ne peut pas être rangé en sécurité, signale-le avec le triangle.</li>
</ul>
<h3>Où te garer, dans l'ordre</h3>
<ol>
<li>Sur l'accotement de plain-pied ou la bande de stationnement, s'il y a de la place (hors agglomération : sur la bande de stationnement et sur tous les accotements).</li>
<li>Si l'accotement est trop étroit : en partie dessus, en laissant au moins 1,5 m de passage aux piétons quand il n'y a pas de trottoir.</li>
<li>Sinon sur la chaussée : le plus près du bord, à droite dans le sens de la marche, jamais en double file, avec au moins 1 m entre deux voitures garées.</li>
</ol>
<p>Dans une rue à sens unique, tu peux te garer à droite comme à gauche (même chose dans une zone résidentielle ou de rencontre, sur les emplacements prévus).</p>
<h3>Interdit sur la chaussée et sur l'accotement</h3>

<li>Exception pour ces deux dernières règles : le bord inférieur du signal ou du feu est à 2 m de haut au moins et ton véhicule, chargement compris, ne dépasse pas 1,65 m.</li>
<li>Partout où ton véhicule met les autres en danger ou les gêne sans raison valable.</li>
</ul>
<h3>Autres lieux interdits</h3>

</ul>`,[

["Les piétons",`
<h3>Qui est un piéton ?</h3>
<ul>
<li>Un <b>usager</b> est une personne qui utilise la voie publique : piéton ou conducteur (de véhicule ou d'animaux). Un vélo, une voiture ou un cheval n'est pas un usager.</li>
<li>Est un piéton : celui qui marche, qui pousse un caddie ou une brouette, qui se déplace en fauteuil roulant ou avec un engin qui ne dépasse pas l'allure du pas, et celui qui <b>pousse un vélo ou un cyclomoteur</b> (sur le trottoir).</li>
<li>Un cavalier, ou celui qui accompagne un cheval, n'est pas un piéton : c'est un conducteur. Celui qui pousse une moto aussi : il porte son casque et il a la priorité de droite s'il vient de droite.</li>
<li>Le piéton marche sur le trottoir, le sentier ou l'accotement. S'il n'y en a pas, il peut marcher sur la piste cyclable (de préférence) ou sur la chaussée.</li>
</ul>
<h3>Le passage pour piétons</h3>
<ul>
<li>Un signal d'indication bleu se trouve près du passage, et un signal de danger rouge environ 150 m avant. S'il y a un passage à moins de 20 m, le piéton doit l'emprunter.</li>
<li>Les piétons sur le passage, ou qui ont l'intention de l'emprunter, ont <b>toujours la priorité</b>. Si un obstacle te cache la vue (véhicule garé, conteneur, file en sens inverse), imagine un piéton et adapte ta vitesse.</li>
<li>Tu ne dépasses jamais un véhicule qui ralentit ou s'arrête devant le passage : infraction grave.</li>
<li>Arrêt et stationnement interdits sur le passage, et sur la chaussée jusqu'à 5 m avant (idem pour un passage pour cyclistes). Après le passage, tu peux t'arrêter ou stationner, sauf signal ou marquage contraire.</li>
</ul>
<h3>Sans passage pour piétons</h3>
<ul>
<li>Le piéton cède le passage et traverse perpendiculairement à l'axe, sans s'attarder.</li>
<li>Mais le conducteur ne met jamais un piéton en danger. Redouble de prudence avec les enfants, les personnes âgées et les personnes handicapées (aveugles, fauteuils) : ralentis et arrête-toi si nécessaire.</li>
</ul>
<h3>Zone piétonne, arrêts de bus et transport scolaire</h3>
<ul>

</ul>`,[

["Stationnement interdit, arrêt permis, stationnement alterné",`
<h3>Arrêt permis, stationnement interdit</h3>
<ul>
<li>S'il n'y a pas 1 m libre devant et derrière ta voiture.</li>
<li>À moins de 15 m de part et d'autre d'un panneau d'arrêt de tram, bus ou trolleybus.</li>
<li>Devant l'accès carrossable d'une propriété ou devant une porte de garage. L'occupant peut s'y garer s'il y a reproduit visiblement sa plaque.</li>
<li>Là où tu empêches l'accès à des emplacements situés hors de la chaussée, ou un véhicule de quitter son emplacement.</li>
<li>Devant un obstacle qui force des cyclistes, des cyclomoteurs à deux roues ou des piétons à passer sur la chaussée.</li>
<li>Là où la chaussée est trop étroite : il faut laisser au moins 3 m de passage libre.</li>
<li>Sur une chaussée à double sens, du côté opposé à un véhicule déjà arrêté ou garé, si cela gêne le croisement de deux autres véhicules.</li>
<li>Hors agglomération, sur la chaussée d'une route prioritaire : tu peux t'y arrêter, ou te garer sur l'accotement. En agglomération, c'est permis.</li>
<li>Sur une chaussée divisée en bandes de circulation, sauf signalisation contraire. Sur la bande de stationnement ou l'accotement le long de ces bandes, c'est permis.</li>
<li>Sur la chaussée centrale d'une voie publique à trois chaussées, sauf signal contraire.</li>
<li>Hors agglomération, du côté gauche d'une voie à deux chaussées. En agglomération, tu peux te garer à gauche, sur l'accotement de plain-pied ou dans la bande de stationnement.</li>
<li>Le long d'une <b>ligne jaune discontinue</b> au bord de la chaussée. Une ligne jaune continue, ou d'une autre couleur, n'interdit rien.</li>
<li>Sur les emplacements réservés aux personnes handicapées.</li>
</ul>
<h3>Signaux d'interdiction</h3>
<ul>
<li>Rond barré <b>d'une diagonale</b> : stationnement interdit, de ce côté, sur la chaussée et l'accotement, du signal jusqu'au carrefour suivant.</li>
<li>Rond barré <b>de deux diagonales</b> : arrêt et stationnement interdits, de ce côté, du signal jusqu'au carrefour suivant.</li>
<li>Flèche sous le signal : vers le haut = l'interdiction commence après le signal. Vers le bas = elle s'applique jusqu'au signal. Haut et bas = de part et d'autre du signal.</li>
<li>Un panneau additionnel « 20 m » : l'interdiction commence au signal et vaut sur 20 m.</li>
</ul>

<ul>
<li>Signal E5 : stationnement interdit de ce côté du <b>1er au 15</b> du mois. Signal E7 : interdit du <b>16 à la fin du mois</b>. Tu te gares de l'autre côté.</li>
<li>L'interdiction vaut pour la chaussée, pas pour l'accotement.</li>
<li>Tu changes de côté le dernier jour de la période, entre <b>19 h 30 et 20 h</b>.</li>

["Dépasser par la gauche : la méthode",`
<h3>Dépasser ou contourner ?</h3>
<ul>
<li><b>Dépasser</b> : un véhicule <b>en mouvement</b>, qui roule moins vite que la vitesse maximale. On le dépasse par la gauche.</li>
<li><b>Contourner</b> : un véhicule <b>à l'arrêt</b> ou en stationnement. Ce n'est pas un dépassement : tu passes simplement devant, c'est un obstacle.</li>
</ul>
<h3>Avant de dépasser, six questions</h3>
<ol>
<li>Le véhicule devant roule-t-il moins vite que la vitesse maximale ?</li>
<li>Puis-je le dépasser vite sans dépasser la vitesse autorisée ?</li>
<li>Un véhicule arrive-t-il en sens inverse ?</li>
<li>Un véhicule derrière moi est-il déjà en train de me dépasser ?</li>
<li>Y a-t-il assez de place pour me rabattre à droite ensuite ?</li>
<li>Un signal ou une règle interdit-il de dépasser ici ?</li>
</ol>
<h3>Les étapes, dans l'ordre</h3>
<ol>
<li>Contrôle le rétroviseur et l'angle mort, puis mets le clignotant gauche.</li>
<li>Déplace-toi à gauche, puis <b>éteins</b> le clignotant : on ne le garde pas pendant tout le dépassement.</li>
<li>Dépasse rapidement.</li>
<li>Une fois dépassé, mets le clignotant droit.</li>
<li>Reviens à droite après contrôle du rétroviseur droit et de l'angle mort.</li>
</ol>
<h3>Distance latérale</h3>
<ul>
<li>Véhicule : une distance « suffisante ».</li>
<li>Piéton, cycliste ou cyclomotoriste : au moins <b>1 m</b> en agglomération, au moins <b>1,5 m</b> hors agglomération (sur la chaussée comme sur la piste cyclable).</li>
</ul>
<h3>Deux cas où l'on dépasse par la droite</h3>
<ul>
<li>Le véhicule devant a mis son clignotant gauche et s'est déjà déporté pour tourner : tu le dépasses par la droite, sans franchir la large ligne blanche (bord fictif) ni rouler sur la piste cyclable. L'accotement de plain-pied est possible si tu ne mets personne en danger.</li>
<li><b>Tram</b> : on le dépasse par la droite. Si les rails sont au milieu de la chaussée et qu'un voyageur descend, tu ralentis et tu t'arrêtes si nécessaire, sauf s'il y a une bordure surélevée à côté des rails. Par la gauche seulement si la droite est impossible (passage étroit, travaux, véhicule garé) ou si les rails sont sur la partie droite de la chaussée.</li>
</ul>
<h3>Ce qui n'est pas un dépassement</h3>
<ul>
<li>Une file qui va un peu plus vite qu'une autre. Tu peux choisir ta file : sur une chaussée à double sens avec au moins quatre bandes (seulement tes bandes), sur une chaussée à sens unique, ou sous des signaux lumineux de bande (croix rouge, flèche verte vers le bas, flèche orange oblique).</li>
<li>En agglomération, sur une voie à sens unique à bandes, ou à double sens avec au moins quatre bandes dont deux par sens : tu choisis la bande qui convient à ta destination.</li>
<li>Signaux d'indication de direction : les règles de dépassement s'appliquent après ces signaux, pas avant.</li>
<li>Motos dans un embouteillage : entre les files, 50 km/h maximum, au plus 20 km/h plus vite que les véhicules dépassés (sur autoroute : entre les deux bandes de gauche).</li>
</ul>`,[

<h3>Usager ou conducteur ?</h3>
<ul>
<li><b>Usager</b> : toute personne qui utilise la voie publique, piétons et conducteurs de véhicules, motorisés ou non.</li>
<li><b>Conducteur</b> : celui qui conduit un véhicule (sans moteur ou à moteur) et celui qui mène ou surveille des animaux de trait, de charge ou une monture. Le mot ne comprend pas les piétons.</li>
<li>Exemples de conducteurs : un cavalier, la personne qui marche à côté de lui, un fermier qui accompagne ses vaches, celui qui pousse une charrette à bras, celui qui conduit un chariot attelé.</li>
<li>Pousser un cyclomoteur en panne ou un vélo crevé : tu es un <b>piéton</b>. Pas de permis, pas de casque, et tu marches sur le trottoir.</li>
<li>Pousser une <b>moto</b> (ou une voiture) : tu es un <b>conducteur</b>. Permis, casque, et tu marches sur la chaussée.</li>
</ul>

["Éco-conduite et carburant",`
<h3>Faut-il vraiment prendre la voiture ?</h3>
<ul>
<li>Jusqu'à environ 1 km : à pied. De 1 à 10 km : à vélo. Sinon, transports en commun si possible.</li>
<li>Les petits trajets avec un moteur froid consomment plus et abiment le moteur : sois doux tant qu'il n'est pas à température.</li>
</ul>
<h3>Réduire la consommation</h3>
<ul>
<li><b>Changer de rapport</b> vers 2 500 tours en essence, 2 000 en diesel. Tu dépasses ces régimes pour t'insérer sur une voie rapide ou dépasser vite.</li>
<li>Le <b>poids</b> augmente la consommation : vide le coffre, ne garde pas une remorque inutilement.</li>
<li><b>Coffre de toit et galerie</b> augmentent la résistance à l'air : ne roule pas avec un coffre vide ou avec les barres. Un porte-vélo à l'arrière consomme moins qu'un porte-vélo sur le toit.</li>
<li><b>Vitres</b> à moitié ouvertes : environ 5 % de plus. Mieux vaut fermer et ventiler. Si tu ouvres celle du conducteur, ouvre un peu celle du passager arrière droit pour éviter l'effet « parachute ».</li>
<li><b>Courant</b> : climatisation, ventilateur, lunette arrière chauffante, sièges chauffants consomment du carburant. Coupe-les s'ils sont inutiles.</li>
<li><b>Pneus</b> : respecte la pression du constructeur, un peu plus pour une charge lourde ou un long trajet. Pas de pneus usés, jamais recreusés.</li>
<li><b>Moteur</b> mal réglé ou filtre à air sale : plus de consommation. Fais entretenir ta voiture.</li>
<li>Le <b>catalyseur</b> réduit la pollution des gaz d'échappement.</li>
<li><b>Couper le moteur</b> quand tu t'immobilises longtemps (file, passage à niveau) : le code le prévoit. La règle des « 30 secondes » n'est pas dans la loi.</li>
</ul>
<h3>Carburants et écologie</h3>
<ul>
<li>Le GPL est le carburant le plus écologique. L'essence est plus écologique que le diesel. Le diesel sans soufre est plus écologique que le diesel ordinaire.</li>
<li>Le mazout de chauffage est coloré en rouge et taxé autrement : rouler au rouge est interdit.</li>
<li><b>Zone de basses émissions</b> : zone où certains véhicules trop polluants sont interdits, avec des panneaux de début et de fin. Les conditions varient selon les villes : vérifie avant d'y aller.</li>
<li><b>Norme EURO</b> et éco-score (de 0 à 100, plus c'est haut, mieux c'est) : ils figurent sur le certificat d'immatriculation.</li>
</ul>
<h3>Conduite défensive</h3>
<p>Regarde au-delà du conducteur devant toi et anticipe les erreurs des autres. Relâcher l'accélérateur à temps (frein moteur) économise du carburant et des plaquettes, et réduit les distances d'arrêt.</p>`,[
["À quel régime conseillé passe-t-on au rapport supérieur avec un moteur à essence ?",["2 500 tours","2 000 tours","4 000 tours"],0,"2 500 tours en essence."],
["Et avec un moteur diesel ?",["2 000 tours","2 500 tours","3 500 tours"],0,"2 000 tours en diesel."],
["Quel carburant est le plus écologique ?",["Le GPL","Le diesel","L'essence"],0,"Le GPL est le plus écologique, puis l'essence, puis le diesel."],
["Rouler avec du mazout de chauffage rouge est…",["interdit","autorisé","autorisé la nuit"],0,"Rouler au rouge est interdit."],
["Où fixer un porte-vélo pour consommer moins ?",["À l'arrière de la voiture","Sur le toit","Sur le capot"],0,"À l'arrière : moins de résistance à l'air."],
["Tu t'immobilises longtemps (file, passage à niveau). Que prévoit le code ?",["Couper le moteur","Laisser tourner le moteur","Mettre la climatisation"],0,"Le code prévoit de couper le moteur."]]]
];

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$("#app");
let pool=[],i=0,sc=0,miss=[],done={},t0=0,tmr=0;try{done=JSON.parse(localStorage.getItem("pc")||"{}")}catch(e){}
const bx=()=>{try{return +localStorage.getItem("pcx")||0}catch(e){return 0}};
const wire=()=>$$(".back").forEach(b=>b.onclick=home),
 back=`<button class="back">‹ Retour au cours</button>`,
 on=(s,f)=>{const e=$(s);if(e)e.onclick=f};

function home(){clearInterval(tmr);
 app.innerHTML=`<p>Tu pars de zéro ? Parfait. Suis les leçons dans l'ordre : chacune explique d'abord, puis te pose quelques questions.</p>`+
 L.map((l,k)=>`<button class="item" data-k="${k}"><b>${k+1}</b><span>${l[0]}</span><em>${done[k]!=null?done[k]+"/"+l[2].length:""}</em></button>`).join("")+
 `<button class="item" data-k="-1"><b>★</b><span>Examen blanc : 50 questions, seuil de 41</span><em>${bx()?"Meilleur : "+bx()+"/50":""}</em></button><p class="mut">Ce cours suit le code de la route actuel : d'après les sources trouvées, le nouveau Code de la voie publique n'arrive qu'en 2027. L'examen théorique compte 50 questions. Résumé non officiel : complète avec codedelaroute.be et les exercices de permisdeconduire-online.be.</p><button class="back" id="rs">Effacer ma progression</button>`;
 $$(".item").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;k<0?quiz(-1):lesson(k)});
 on("#rs",()=>{done={};try{localStorage.removeItem("pc");localStorage.removeItem("pcx")}catch(e){}home()});
}
function lesson(k){
 const l=L[k];
 app.innerHTML=back+`<h2>${k+1}. ${l[0]}</h2>${l[1]}<button class="go" id="t">Je me teste</button>`;
 on("#t",()=>quiz(k));wire();scrollTo(0,0);
}
function quiz(k){
 const all=L.flatMap(l=>l[2]);
 pool=(k<0?all:L[k][2]).slice().sort(()=>Math.random()-.5).slice(0,k<0?50:99);
 i=0;sc=0;miss=[];t0=Date.now();clearInterval(tmr);ask(k);
}
function ask(k){
 const q=pool[i],ord=[...q[1].keys()].sort(()=>Math.random()-.5);
 app.innerHTML=back+`<div class="bar"><span style="width:${i/pool.length*100}%"></span></div><p class="mut">Question ${i+1} sur ${pool.length}${k<0?`, <span id="tm"></span>`:""}</p><h2>${q[0]}</h2>`+
 ord.map(j=>`<button class="opt" data-j="${j}">${q[1][j]}</button>`).join("")+`<div id="fb"></div>`;
 $$(".opt").forEach(b=>b.onclick=()=>pick(k,+b.dataset.j));wire();
 if(k<0){clearInterval(tmr);const f=()=>{const s=Math.floor((Date.now()-t0)/1000),e=$("#tm");if(e)e.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};f();tmr=setInterval(f,1000)}
}
function pick(k,j){
 const q=pool[i],ok=j==q[2];
 sc+=ok;if(!ok)miss.push(q);
 $$(".opt").forEach(b=>{b.disabled=true;const n=+b.dataset.j;if(n==q[2])b.classList.add("ok");else if(n==j)b.classList.add("ko")});
 $("#fb").innerHTML=`<p class="note ${ok?"y":"n"}"><b>${ok?"Bonne réponse.":"Pas tout à fait."}</b> ${q[3]}</p><button class="go" id="nx">${i+1<pool.length?"Question suivante":"Voir le résultat"}</button>`;
 on("#nx",()=>{i++;i<pool.length?ask(k):end(k)});
}
function end(k){
 clearInterval(tmr);const n=pool.length,nx=k<0?null:(k+1<L.length?k+1:-1),sec=Math.floor((Date.now()-t0)/1000),tt=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"),ok=sc>=41;
 if(k>=0)done[k]=sc;else try{if(sc>bx())localStorage.setItem("pcx",sc)}catch(e){}
 try{localStorage.setItem("pc",JSON.stringify(done))}catch(e){}
 app.innerHTML=back+`<h2>Score : ${sc} sur ${n}</h2>${k<0?`<p><b>${ok?"Réussi : tu atteins le seuil de 41 sur 50.":"Pas encore : il faut 41 sur 50 pour réussir."}</b> Durée : ${tt}.</p>`:""}<p>${sc==n?"Parfait !":sc/n>=.7?"Très bien, tu as compris l'essentiel.":"Relis la leçon, puis réessaie : c'est comme ça qu'on apprend."}</p>`+
 (miss.length?`<h3>À revoir</h3><ul>`+miss.map(q=>`<li><b>${q[0]}</b><br>Réponse : ${q[1][q[2]]}. ${q[3]}</li>`).join("")+`</ul>`:"")+
 (nx!==null?`<button class="go" id="n2">${nx<0?"Passer à l'examen blanc":"Leçon suivante"}</button>`:`<button class="go" id="n2">Refaire un examen blanc</button>`)+
 (k>=0?`<button class="chip" id="rl">Revoir la leçon</button>`:"");
 on("#n2",()=>nx===null?quiz(-1):nx<0?quiz(-1):lesson(nx));on("#rl",()=>lesson(k));wire();scrollTo(0,0);
}
home();
</script>
</body>
</html>
